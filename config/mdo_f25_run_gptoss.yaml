# LOCAL / FREE config — identical to mdo_f25_run_claude.yaml except the LLM.
#
# Purpose: run the coordination framework end-to-end on a LOCAL open model so
# CODE debugging costs $0. Uses backend "transformers" (in-process on the two
# RTX 5090s) rather than "vllm" — vLLM is ABI-broken on this Blackwell sm_120
# box (torch/vllm/flash-attn `undefined symbol`), see .claude/BUGS.md B7.
#
# STRONGER local model than Qwen3-8B (~21B MoE, 4 experts/token). Reason for
# existing: Qwen3-8B COMPLETED an orchestrated link but its discipline workers
# no-op'd — no SU2 at all, every worker returning a ~100-char answer straight to
# final_answer — so its "uncoupled" verdict measured the model, not the
# coordination structure (.claude/BUGS.md B1 follow-up).
#
# MXFP4 weights dequantize to bf16 (~40 GB) because Triton >= 3.4 / kernels are
# not installed, so device_map MUST shard across both 5090s. Loads in ~7 s.
#
# gpt-oss emits harmony tool calls (`to=functions.NAME` header + bare argument
# JSON) — handled in src/llm/thinking_model.py; without that it burns a retry on
# every single call.
#
# ⚠️⚠️ NOT VIABLE ON THIS BOX AS CONFIGURED — kept for the record + for the day
# MXFP4 works. Three runs, three CUDA OOMs at progressively later points:
#   19/19 GiB caps  -> OOM allocating 4.3 GiB  (~11k-token orchestrated prompt)
#   15/15 GiB + CPU -> OOM allocating 15.8 GiB at step 2, after
#                      list_available_tools pushed context to ~40k tokens
# Root cause is gpt-oss's 201k vocab against this framework's very long MCP
# tool-schema prompts: the per-token logits width makes long-context
# allocations enormous, and bf16 weights (~40 GB, because MXFP4 needs
# triton >= 3.4) leave no room for them.
# THE FIX is MXFP4 in a SEPARATE env (triton >= 3.4 + `kernels`): weights drop
# ~40 GB -> ~13 GB, fits ONE card, frees ~27 GB for activations. Do NOT upgrade
# triton in this venv — that is the ABI trap that broke vLLM (see B7).
llm:
  model_id: "openai/gpt-oss-20b"
  backend: "transformers"
  # MUST stay "balanced": bf16-dequantized gpt-oss-20b does not fit one 32 GB card.
  device_map: "balanced"
  torch_dtype: "auto"
  # "balanced" splits by LAYER, and gpt-oss's MoE blocks are chunky enough that
  # it put ~24 GB on GPU 0 and OOM'd mid-run: the orchestrated prompt is ~7k
  # tokens and gpt-oss's 201k vocab makes the prefill logits alone ~3-4 GB.
  # Cap each device so the split is genuinely even and both keep headroom.
  # 19/19 GiB still OOM'd: a ~11k-token orchestrated prompt needs a single
  # ~4.3 GiB allocation and GPU1 had only 3.26 GiB spare. Cap lower so ~10 GB
  # of layers offload to CPU and BOTH cards keep ~16 GiB of activation headroom.
  # Costs generation speed; the alternative (MXFP4, ~13 GB weights) needs
  # triton >= 3.4 in a SEPARATE env — do not upgrade triton here, see B7.
  model_kwargs:
    max_memory:
      0: "15GiB"
      1: "15GiB"
      cpu: "60GiB"
  # gpt-oss reasons in its analysis channel before the call, so the same
  # rationale as Qwen applies: leave room for reasoning + the tool call.
  max_new_tokens: 4096
  temperature: 0.3
  reliability:
    max_retries: 3

mcp:
  mode: "real"
  servers:
    - name: "tigl"
      url: "http://127.0.0.1:8500/mcp"
      transport: "streamable-http"
    - name: "su2"
      url: "http://127.0.0.1:8200/mcp"
      transport: "streamable-http"
    - name: "mass"
      url: "http://127.0.0.1:8700/mcp"
      transport: "streamable-http"
    - name: "pycycle"
      url: "http://127.0.0.1:8400/mcp"
      transport: "streamable-http"
    - name: "aviary"
      url: "http://127.0.0.1:8600/mcp"
      transport: "streamable-http"

skills:
  path: "skills/aircraft-design-mdo"
  mode: "auto"

agents_config: "config/mdo_f25_sequential_agents.yaml"
coordination_config: "config/aviary_mdo_f25_sequential.yaml"

logging:
  level: "INFO"
  output_dir: "logs/"
  save_full_history: true

ui:
  enabled: false
  port: 8501
