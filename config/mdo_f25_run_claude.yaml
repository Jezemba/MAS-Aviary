llm:
  model_id: "anthropic/claude-sonnet-4-20250514"
  backend: "litellm"
  max_new_tokens: 4096
  # 2026-05-26: switched back to Claude from openai/gpt-4o after
  # per_stage runs (v11-v14) showed gpt-4o workers consistently
  # making sloppy errors (eliding file paths with "...", skipping
  # open_cpacs and making up session UUIDs, paraphrasing tool errors
  # in natural language that confused retry detection). Claude is
  # generally more reliable at literal tool-arg passing. Earlier
  # gpt-5 attempt produced ~20k reasoning tokens per step that
  # smolagents couldn't parse — don't switch to that model family.
  temperature: 0.3

mcp:
  mode: "real"
  servers:
    - name: "tigl"
      url: "http://127.0.0.1:8500/mcp"
      transport: "streamable-http"
    - name: "su2"
      url: "http://127.0.0.1:8200/mcp"
      transport: "streamable-http"
    - name: "mass"
      url: "http://127.0.0.1:8700/mcp"
      transport: "streamable-http"
    - name: "pycycle"
      url: "http://127.0.0.1:8400/mcp"
      transport: "streamable-http"
    - name: "aviary"
      url: "http://127.0.0.1:8600/mcp"
      transport: "streamable-http"

skills:
  path: "skills/aircraft-design-mdo"
  mode: "auto"

agents_config: "config/mdo_f25_sequential_agents.yaml"
coordination_config: "config/aviary_mdo_f25_sequential.yaml"

logging:
  level: "INFO"
  output_dir: "logs/"
  save_full_history: true

ui:
  enabled: false
  port: 8501
