strategy: "networked"

networked:
  # 3 peer agents at startup. Each peer has access to ALL tools (the
  # networked strategy is intentionally structure-less — peers self-
  # organize via the blackboard, no orchestrator, no phase gating).
  # The peer_template in config/mdo_f25_networked_agents.yaml gives
  # each peer the MDO discipline knowledge they need to claim and
  # execute the right MCP tools.
  initial_agents: 3

  # Allow the team to spawn additional peers as work expands. The
  # F25 pipeline naturally splits into 7 discipline areas
  # (geometry / aero / mass / propulsion / mission / sim / eval) so
  # an upper bound of 7 lets the team grow to one peer per area
  # without unbounded spawning.
  max_agents: 7

  # Each peer's ReAct budget. F25 disciplines need room for read +
  # claim + tool call + write_blackboard at minimum, often with a
  # retry. 15 steps is enough for several round-trips per peer turn.
  agent_max_steps: 15

  # Soft claiming: peers announce intent on the blackboard but
  # duplicates are warned, not blocked. With 3 peers and 7 work
  # areas, soft claiming avoids deadlock when two peers happen to
  # claim adjacent work.
  claiming_mode: "soft"

  # NO workflow_phases — networked peers should see all 54 MCP tools
  # and figure out coordination from the blackboard + the discipline
  # knowledge in their peer_template. Phase gating would defeat the
  # purpose of the strategy.

  # selection_mode controls how the strategy picks peers each turn:
  #   "round_robin" — fixed rotation (default; used by aviary-only combos)
  #   "volunteer" — parallel "want to act next?" votes per turn
  #   "concurrent_blackboard" — CodeCRDT pattern: all peers run in
  #     parallel threads each turn, race to claim TODOs from the
  #     shared blackboard. (arxiv 2510.18893)
  #
  # We use concurrent_blackboard here so the F25 MDO task gets real
  # peer collaboration: 3 peers see all 54 MCP tools + the 7 discipline
  # TODOs below; each peer's ReAct loop scans the board, claims a
  # pending TODO, executes it via the appropriate MCP tools, and posts
  # the result. The threading.Lock on Blackboard.claim_todo gives
  # at-most-one-winner safety so no discipline is double-executed.
  selection_mode: "concurrent_blackboard"

  # Maximum parallel_run cycles. Each cycle runs ALL peers concurrently
  # for one ReAct budget. If all TODOs are done after cycle 1 the run
  # terminates immediately; otherwise the strategy dispatches up to
  # max_concurrent_runs cycles before giving up. 2 gives one retry pass.
  max_concurrent_runs: 2

  # Initial TODO board. Each peer reads this on its first turn, picks a
  # pending entry, atomically claims it, and executes the discipline via
  # the relevant MCP tools. Order does NOT enforce execution — peers
  # are free to claim in any order. The data-plane middleware (Phase H/K
  # in CHANGELOG) auto-injects upstream values into downstream MCP calls
  # whenever the producing tool is called before the consuming tool, so
  # the team naturally coordinates if the discipline ordering happens to
  # follow geometry -> aero/mass -> mission/sim/eval. If a peer claims
  # mission before geometry, that's allowed — aviary just uses its
  # defaults for un-injected parameters and the result is documented as
  # an un-coupled single-MCP run.
  todo_seed:
    - name: "geometry"
      description: "Open the CPACS file (open_cpacs), inspect the configuration, and generate a CFD-ready volume mesh via generate_volume_mesh. Post the mesh ref + planform stats to the blackboard."
    - name: "aero"
      description: "Create a SU2 session, set the volume mesh from geometry, configure numerics (use get_valid_config_options first), run run_su2_solver, then call read_history_csv to capture CL and CD. The Phase H middleware will auto-inject these into aviary's next set_aircraft_parameters call."
    - name: "mass"
      description: "Validate and estimate the structural mass via mass-mcp (estimate_mass). The Phase K-A middleware will auto-inject Aircraft.Wing.MASS_SCALER into aviary's next set_aircraft_parameters call from mWing_kg. Phase K-B auto-injects Fn_DES into pycycle's set_inputs from mTOM."
    - name: "propulsion"
      description: "Create a pyCycle HBTF model, call get_design_inputs FIRST to see the curated dial list (splitter.BPR, fan.PR, Fn_DES, etc.) — do NOT guess from list_variables. Set inputs and run_cycle."
    - name: "mission"
      description: "Create an aviary session, configure the F25 design mission (range_nmi=2500, num_passengers=239, cruise_mach=0.78, cruise_altitude_ft=33000), and call set_aircraft_parameters. Run set_aircraft_parameters AFTER aero + mass have posted their results so the data-plane middleware can inject CL/CD/MASS_SCALER."
    - name: "simulation"
      description: "Call aviary's run_simulation on the configured session to execute the SLSQP optimizer (~40-60s). Pull fuel_burned_kg / gtow_kg / wing_mass_kg with get_results and post them to the blackboard."
    - name: "evaluation"
      description: "Call check_constraints on the simulation session with the F25 TLAR constraints (fuel_burned_kg <= 15000, gtow_kg <= 90000, range >= 2500 nmi). Post the final VERDICT (COMPLETE / CONTINUE / RETRY) and the structured key:value metrics summary."

  # Peers can see each other's evaluation metrics on the blackboard
  # so they can decide who to retry or build on.
  peer_monitoring_visible: true

  # Reasoning explanations on result entries are visible — helps
  # downstream peers understand why an upstream design choice was
  # made (e.g., "AR=15 picked to match F25 spec" vs blind retry).
  trans_specialist_knowledge: true

  # Predictive knowledge off for now — adds prompt overhead, only
  # useful for explicit "what will B do next?" coordination.
  predictive_knowledge: false

execution_handler: "iterative_feedback"

# iterative_feedback retries stay at the framework default (20). The
# multi-peer rotation problem from wandb 6fhhcem3 was not a retry
# problem — it was a selection problem (round-robin doesn't read the
# blackboard). The new `networked.selection_mode: "volunteer"` below
# handles "who acts next" by polling peers in parallel and reading
# their blackboard awareness. Within a single peer's turn, the
# handler's normal retry behavior is still useful (it lets that one
# peer recover from its own validation errors / NaN trips / etc).
# Once that peer's task is done (success OR exhausted retries) the
# next strategy turn fires the volunteer broadcast again, which
# excludes the just-acted peer and picks a fresh one based on the
# updated blackboard state.

# Primary termination: any peer can call mark_task_done writing
# "DONE" to the blackboard, detected by NetworkedStrategy.is_complete().
# Fallback: TASK_COMPLETE keyword in last message content. max_turns
# is generous because the 5-MCP F25 pipeline has more steps than the
# default aviary-only flow.
termination:
  keyword: "TASK_COMPLETE"
  max_turns: 60
  max_consecutive_errors: 3

context:
  max_recent_messages: 15
  max_context_tokens: 4000
