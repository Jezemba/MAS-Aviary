# MDO F25 Orchestrated Agents — orchestrator delegates to specialists across 5 MCPs.
# MCPs: TiGL (geometry), SU2 (aero CFD), CPACS-Mass (structures), pyCycle (propulsion), Aviary (mission/sim)

required_tool_phases:
  geometry_setup:
    - open_cpacs
    - set_high_level_parameters
    - generate_volume_mesh
  aerodynamic_analysis:
    - create_su2_session
    - set_mesh
    - run_su2_solver
  mass_estimation:
    - validate_cpacs_inputs
    - estimate_mass
  propulsion_analysis:
    - create_cycle_model
    - run_cycle
  mission_setup:
    # create_session is NOT listed: the runner creates the aviary session and B78
    # refuses agent calls to it, so listing it made this phase impossible to
    # complete and reported "not yet run: mission_setup" for the whole run.
    - configure_mission
  simulation:
    - run_simulation
  evaluation:
    - get_results
    - check_constraints

required_result_signals:
  - simulation_succeeded
  - constraints_checked

# verbatim (Jessica, 2026-10-10): the orchestrator's system message is this combination's section of
# orchestrated.md (repo root), sent exactly as written; every message the framework sends the
# orchestrator or its agents is data only (src/coordination/prompt_assembly.py). An agent's system
# message is the persona the orchestrator wrote for it.
prompt_assembly: verbatim
prompt_source: orchestrated.md

agents:
  - name: "orchestrator"
    role: "Creates and manages a team of specialist agents for multi-MCP aircraft MDO"
    # Replaced at initialize() by the orchestrated.md section for the combination (verbatim mode).
    system_prompt: "See orchestrated.md."
    tools: []
    max_steps: 20
