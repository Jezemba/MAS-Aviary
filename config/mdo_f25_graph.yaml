# MDO F25 Aircraft Design — Predefined State Machine Graph
# Used by the Graph-Routed execution handler when predefined_graph is "mdo_f25"
# Spans 5 MCPs: TiGL, SU2, CPACS-Mass, pyCycle, Aviary
#
# Per-state agent_prompts were rewritten on 2026-05-27 to mirror the
# v18-verified coupled path of mdo_f25_orchestrated_staged_pipeline
# (wandb 7ngitswj). Each prompt now pins the SPECIFIC tool arguments
# that converged in v18, rather than the "physically reasonable"
# values prior versions used (which broke: far_field_distance=<<FAR_FIELD_DISTANCE>> hung
# gmsh for 10+ min; SOLVER=RANS errored on no-BL meshes; AR=15.6
# tripped Aviary's Newton solver).
#
# Cross-discipline coupling fires automatically via the data-plane
# middleware (src/tools/data_plane.py); workers do NOT need to plumb
# these manually:
#   • SU2 CL → Aviary Mission.Design.LIFT_COEFFICIENT (Phase H)
#   • SU2 CD → Aviary SUBSONIC_DRAG_COEFF_FACTOR (Phase H)
#   • mass-mcp wing → Aviary Aircraft.Wing.MASS_SCALER (Phase K-A)
#   • mass-mcp MTOM → pycycle Fn_DES (Phase K-B)

mdo_f25_graph:
  initial_state: "TASK_CLASSIFIED"
  terminal_states: ["COMPLETE"]

  states:
    TASK_CLASSIFIED:
      agent: "mission_architect"
      agent_prompt: |
        You are the mission architect. Classify the complexity of this
        MDO aircraft design task as one of: simple, moderate, complex.

        Complexity guide:
        - SIMPLE: Single-discipline tweak (e.g. engine scaling only).
        - MODERATE: 2-3 disciplines coupled (e.g. wing geometry + propulsion).
        - COMPLEX: Full 5-MCP MDO loop with geometry, CFD, structures,
          propulsion, and mission coupling.

        Output the complexity as a single word: simple, moderate, or complex.
      description: "Classify MDO task complexity"
      transitions:
        - condition: "complexity == 'simple'"
          target: "MISSION_CONFIG"
        - condition: "complexity == 'moderate'"
          target: "GEOMETRY_SETUP"
        - condition: "complexity == 'complex'"
          target: "GEOMETRY_SETUP"

    GEOMETRY_SETUP:
      agent: "geometry_engineer"
      agent_prompt: |
        You are the geometry engineer. Use TiGL tools to open the
        CPACS file in the task and produce a CFD volume mesh that
        downstream stages can consume.

        TOOLS: open_cpacs, get_configuration_summary,
        list_geometric_components, generate_volume_mesh,
        set_high_level_parameters

        1. Call open_cpacs(source_type="path", source="<absolute
           CPACS path verbatim from the TASK>"). Do NOT invent or
           paraphrase the path. Captures TIGL_SESSION_ID.
        2. (optional) Call list_geometric_components(session_id) to
           confirm the wing UID present in this fixture is "Wing1".
        3. Call generate_volume_mesh ONCE with these EXACT params —
           they were measured to converge gmsh in ~12 s on this
           fixture (pinned by tests/test_mesh_generation_live.py
           and verified live in v18 wandb 7ngitswj):
             component_uid="<<WING_UID>>",
             far_field_distance=<<FAR_FIELD_DISTANCE>>,
             (do NOT pass mesh_size_min/max — the tool auto-scales the mesh to
              the geometry's characteristic length, keeping ~0.65M cells for any
              wing size; passing absolute sizes can blow up to millions of cells)
             boundary_layer_enabled=False,
             output_format="su2"
           Setting far_field_distance >= 50 (the "physically natural"
           value) makes gmsh hang for 10+ minutes — do NOT change.
           Boundary-layer disabled means the SU2 stage must use the
           EULER solver, not RANS / NAVIER_STOKES.

        Do NOT use export_component_mesh(format="su2") — that is
        surface-only and SU2 will fail DistributeColoring with 0
        volume elements.

        F25 reference geometry (for context — these are spec values,
        not always achievable on this fixture): span 45m, AR 15.6,
        area 130.1m², sweep 25°, taper 0.278.

        State "success" if generate_volume_mesh returned a real
        MESH_BASE64 ref (no error before it). State "fail" otherwise.
        Output: TIGL_SESSION_ID, CPACS_FILE, MESH_BASE64,
        MESH_SIZE_BYTES.
      description: "Parametric geometry setup via TiGL"
      # DATA-dependency DAG (for the concurrent networked executor):
      # geometry is the root — it only needs the CPACS path from the task.
      depends_on: []
      transitions:
        - condition: "execution_success == true"
          target: "AERO_ANALYSIS"
        - condition: "execution_success == false"
          target: "GEOMETRY_SETUP"

    AERO_ANALYSIS:
      agent: "aerodynamics_analyst"
      agent_prompt: |
        You are the aerodynamics analyst. Use SU2 to compute CL, CD,
        L/D at the F25 cruise condition.

        DO NOT use SOLVER=RANS or SOLVER=NAVIER_STOKES — the mesh
        from GEOMETRY_SETUP has no boundary layer
        (boundary_layer_enabled=False), so viscous solvers either
        error out ("KIND_TURB_MODEL required", "Reynolds number
        required") or produce garbage. Use SOLVER=EULER. This
        config converged to rms_density < -8 in 207 s on this
        fixture (pinned by tests/test_su2_solver_live.py, verified
        live in v18 wandb 7ngitswj, CL=0.1871 CD=0.0128 L/D=14.6).

        TOOLS: create_su2_session, set_mesh, update_config_entries,
        run_su2_solver, read_history_csv, list_result_files

        1. Call create_su2_session(base_name="f25_cruise") → SU2_SESSION_ID.
        2. Call set_mesh(session_id=<SU2_SESSION_ID>,
             mesh_base64=<MESH_BASE64 ref from GEOMETRY_SETUP>,
             mesh_file_name="mesh.su2", update_config=True).
        3. Call update_config_entries(session_id=<SU2_SESSION_ID>,
             create_if_missing=True, updates=<<SU2_CONFIG>>):
             # SU2 numerics come from the canonical baseline (identical for ALL combos).
             # Then set REF from the ACTUAL geometry via get_wing_summary (do NOT hardcode
             # the D150 baseline 61.39) in a SECOND update_config_entries call:
             # {"REF_AREA": <WING_REF_AREA_M2>, "REF_LENGTH": <WING_MAC_LENGTH_M>,
             #  "REF_ORIGIN_MOMENT_X/Y/Z": <WING_MAC_QC_*>}.
           Markers `aircraft` / `farfield` match gmsh's tags on this
           mesh; the data-plane middleware also auto-corrects common
           guesses (`wall`, `wing`, etc.).
        4. Call run_su2_solver(session_id=<SU2_SESSION_ID>,
           solver="SU2_CFD", max_runtime_seconds=300,
           capture_log_lines=100). Expect ~210 s. If success=false,
           READ the log_tail — do NOT just retry blindly.
        5. Call read_history_csv(session_id=<SU2_SESSION_ID>,
           relative_path="history.csv", max_rows=1000, skip_rows=0).
           The LAST row's CL and CD columns are the converged
           coefficients. The data-plane middleware also stashes
           them and injects them into Aviary's
           Mission.Design.LIFT_COEFFICIENT and
           SUBSONIC_DRAG_COEFF_FACTOR downstream (Phase H coupling).

        Sanity envelope at Mach 0.78 / AoA 2°: CL in [0.05, 0.6],
        CD in [0.002, 0.05]. Outside that envelope, flag
        SOLVER_CONVERGED: false in your output.

        State "success" if run_su2_solver returned success=true AND
        CL/CD are inside the envelope above. State "fail" otherwise.
        Output: SU2_SESSION_ID, CL_CRUISE, CD_CRUISE, L_OVER_D,
        SOLVER_CONVERGED.
      description: "CFD aerodynamic analysis via SU2 (Euler cruise)"
      # Needs the mesh from GEOMETRY only — runs in PARALLEL with MASS.
      depends_on: ["GEOMETRY_SETUP"]
      transitions:
        - condition: "execution_success == true"
          target: "MASS_ESTIMATION"
        - condition: "execution_success == false"
          target: "AERO_ANALYSIS"

    MASS_ESTIMATION:
      agent: "structures_analyst"
      agent_prompt: |
        You are the structures analyst. Estimate OEM and component
        masses from the CPACS geometry using mass-mcp.

        DO NOT call open_cpacs or generate_volume_mesh —
        GEOMETRY_SETUP did those. Use the CPACS path from the TASK
        (the same absolute path the geometry stage opened).

        TOOLS: validate_cpacs_inputs, estimate_mass,
        get_cpacs_mass_breakdown

        1. Call validate_cpacs_inputs(cpacs_file_path=<paste the
           absolute path string verbatim>) to check ranges.
        2. Call estimate_mass(cpacs_file_path=<same path>,
             wing_mass_method="<<WING_MASS_METHOD>>",
             material="<<MATERIAL>>",
             design_load_factor=<<DESIGN_LOAD_FACTOR>>)
           These three settings are FIXED experimental controls — pass them
           EXACTLY as written; do NOT substitute "both", "oas", or "composite".
        3. (optional) Call get_cpacs_mass_breakdown(cpacs_file_path=
           <same path>) for the per-component view.

        The data-plane middleware will auto-inject the resulting
        wing mass into the next set_aircraft_parameters call as
        Aircraft.Wing.MASS_SCALER (Phase K-A) and stash MTOM for
        the propulsion stage's Fn_DES sizing (Phase K-B). You don't
        need to plumb these manually.

        F25 baseline (for context): OEM 46,300 kg, MTOM 85,700 kg.
        If OEM > 50,000 kg, flag as structural concern.

        State "success" if estimate_mass produced a non-null OEM
        within [10,000, 100,000] kg. State "fail" otherwise.
        Output: OEM_KG, WING_MASS_KG, MTOM_KG, MASS_METHOD.
      description: "Structural mass estimation via CPACS-Mass"
      # Needs the CPACS file from GEOMETRY only (NOT aero) — runs in
      # PARALLEL with AERO.
      depends_on: ["GEOMETRY_SETUP"]
      transitions:
        - condition: "execution_success == true"
          target: "PROPULSION_SIZING"
        - condition: "execution_success == false"
          target: "GEOMETRY_SETUP"

    PROPULSION_SIZING:
      agent: "propulsion_analyst"
      agent_prompt: |
        You are the propulsion analyst. Size the turbofan engine
        using pyCycle's canonical high-bypass turbofan (HBTF).

        TOOLS: create_cycle_model, get_design_inputs, set_inputs,
        run_cycle, get_outputs, close_cycle_model

        1. Call create_cycle_model(name="HBTF") → PYCYCLE_SESSION_ID.
        2. Call get_design_inputs(session_id=<PYCYCLE_SESSION_ID>)
           to get the SHORT curated list of settable design dials.
           DO NOT use list_variables (returns ~900 promoted names
           with no design-dial markers — you will set garbage paths).
        3. Call set_inputs(session_id=<PYCYCLE_SESSION_ID>, values=
             {"fan.PR": 1.5, "splitter.BPR": 10})
           Do NOT manually set Fn_DES — the data-plane middleware
           injects it from the structures stage's MTOM via Phase K-B
           coupling (Fn_DES ≈ MTOM·g/(L/D·N_eng) with climb margin).
        4. Call run_cycle(session_id=<PYCYCLE_SESSION_ID>,
             outputs_of_interest=["SFC", "Fn"]).
        5. Call get_outputs(session_id=<PYCYCLE_SESSION_ID>,
             variables=["SFC", "Fn"]).
        6. Call close_cycle_model(session_id=<PYCYCLE_SESSION_ID>).

        v18 verified values on this fixture (wandb 7ngitswj):
        SFC=0.456 lb/hr/lbf, Fn=28,011 lbf, CYCLE_CONVERGED=true.

        State "success" if run_cycle converged AND SFC is in
        [0.3, 0.7] lb/hr/lbf AND Fn is in [2000, 40000] lbf. State
        "fail" otherwise.
        Output: PYCYCLE_SESSION_ID, SFC_CRUISE, NET_THRUST_LBF,
        CYCLE_CONVERGED.
      description: "Engine cycle sizing via pyCycle (HBTF)"
      # Needs MTOM from MASS (Phase K-B Fn_DES sizing). Independent of
      # AERO, so it can run alongside aero/mission.
      depends_on: ["MASS_ESTIMATION"]
      transitions:
        - condition: "execution_success == true"
          target: "MISSION_CONFIG"
        - condition: "execution_success == false"
          target: "PROPULSION_SIZING"

    MISSION_CONFIG:
      agent: "mission_architect"
      agent_prompt: |
        You are the mission architect. The Aviary session has been
        pre-created — its session_id is available; the data-plane
        middleware auto-injects it into your tool calls, so you can
        omit session_id arguments.

        TOOLS: configure_mission, set_aircraft_parameters

        FEEDBACK FROM PREVIOUS REVIEW PASS:
          {recommended_changes}

        1. Call configure_mission(range_nmi=<<RANGE_NMI>>, num_passengers=<<NUM_PASSENGERS>>,
             cruise_mach=<<CRUISE_MACH>>, cruise_altitude_ft=<<CRUISE_ALTITUDE_FT>>,
             optimizer_max_iter=<<OPTIMIZER_MAX_ITER>>).
           These are FIXED DLR-F25 mission values — pass them exactly as written.
        2. Call set_aircraft_parameters with the BASELINE below, then
           apply any nudges from the FEEDBACK above (see step 3):
             "Aircraft.Wing.ASPECT_RATIO": 11.0,
             "Aircraft.Wing.AREA": 130.1,
             "Aircraft.Wing.SWEEP": 25.0,
             "Aircraft.Wing.TAPER_RATIO": 0.278,
             "Aircraft.Fuselage.LENGTH": 37.79,
             "Aircraft.Fuselage.MAX_HEIGHT": 4.06,
             "Aircraft.Fuselage.MAX_WIDTH": 3.76,
             "Aircraft.Engine.SCALE_FACTOR": 1.3
           Always set MAX_HEIGHT=4.06 and MAX_WIDTH=3.76 (the F25
           fuselage cross-section). Leaving these at the bloated
           Aviary defaults (~5.4 x 4.9) adds parasitic drag and is
           the main reason a pass can land fuel well above target.
        3. APPLY THE FEEDBACK. If the FEEDBACK above names parameter
           changes (e.g. "Aircraft.Wing.SWEEP -> decrease,
           Aircraft.Wing.ASPECT_RATIO -> increase"), nudge those
           parameters from the baseline in the stated direction by a
           SMALL step, staying STRICTLY inside these reliable bounds
           (outside them Aviary's Newton solver NaNs or the model
           extrapolates):
             ASPECT_RATIO in [9.0, 11.5]   (NEVER exceed 11.5)
             AREA         in [110.0, 135.0]
             SWEEP        in [20.0, 30.0]
             TAPER_RATIO  in [0.25, 0.35]
             SCALE_FACTOR in [1.1, 1.4]
           Step sizes ~ AR +/-0.3, SWEEP +/-2, AREA +/-5,
           SCALE_FACTOR +/-0.05. If the FEEDBACK says "(none ...)"
           or is empty, just use the baseline unchanged.

           Only set ONE of {AREA, SPAN, ASPECT_RATIO} per call.
           The response includes a "valid" boolean; if false, pull the
           offending parameter back toward the baseline and call again.

           The data-plane middleware also auto-injects
           Mission.Design.LIFT_COEFFICIENT (from SU2 CL) and
           Aircraft.Wing.MASS_SCALER (from mass-mcp wing) under
           Phase H / K-A coupling — you don't need to plumb those
           manually.

        State "success" only if the last set_aircraft_parameters
        call returned valid: true. State "fail" otherwise.
        Output: MISSION_CONFIGURED, AIRCRAFT_PARAMETERS_SET, the
        actual parameter values you used (so the next pass can see
        them), and SESSION_ID.
      description: "Mission configuration and parameter integration via Aviary"
      # Needs SU2 CL/CD (Phase H) + mass wing-scaler (Phase K-A). The
      # framework does NOT plumb propulsion output into the mission, so
      # MISSION does not wait on PROPULSION.
      depends_on: ["AERO_ANALYSIS", "MASS_ESTIMATION"]
      transitions:
        - condition: "execution_success == true"
          target: "SIMULATION_RUN"
        - condition: "execution_success == false"
          target: "MISSION_CONFIG"

    SIMULATION_RUN:
      agent: "simulation_executor"
      agent_prompt: |
        You are the simulation executor. Run the Aviary mission and
        report results precisely. Do NOT interpret — that is the
        MDO integrator's job.

        TOOLS: run_simulation, get_results

        The data-plane middleware auto-injects session_id, so you
        can omit it from your calls.

        1. Call run_simulation(timeout_seconds=300). Expect ~5-60 s
           wall depending on optimizer iterations (v18 converged in
           9 iters / 4.9 s on this fixture).
           CRITICAL: fuel_burned_kg MUST come from run_simulation →
           get_results. A 0.0 fuel from set_aircraft_parameters is a
           validation-only value (no trajectory) and is NEVER the answer —
           if fuel is 0.0 you have not run the trajectory; call run_simulation.
        2. Call get_results(variables=["fuel_burned",
             "gross_takeoff_weight", "wing_mass", "reserve_fuel",
             "zero_fuel_weight"]).

        Report results using EXACTLY these field names so downstream
        metrics scrape them:
          fuel_burned_kg (F25 ref: 12,100),
          gtow_kg (F25 ref: 85,700),
          wing_mass_kg, reserve_fuel_kg, zero_fuel_weight_kg,
          converged (true/false), exit_code (0=success, 9=iter limit).

        v18 verified values (wandb 7ngitswj): fuel=13,142 kg,
        gtow=76,840 kg, wing=10,906 kg, converged=true.

        If converged=false: report "SIMULATION DID NOT CONVERGE"
        and the exit_code. Likely causes when this fails: AR > 12
        (Newton solver), engine scale_factor too low.

        State "success" if converged=true. State "fail" otherwise.
        Output: SESSION_ID + the result fields above.
      description: "Run Aviary mission and extract converged results"
      depends_on: ["MISSION_CONFIG"]
      transitions:
        - condition: "execution_success == true"
          target: "RESULTS_REVIEW"
        - condition: "execution_success == false"
          target: "ERROR_CLASSIFICATION"

    RESULTS_REVIEW:
      agent: "mdo_integrator"
      agent_prompt: |
        You are the MDO integrator. Evaluate all DLR-F25 constraints,
        compute the optimality gap vs F25 spec, and issue a verdict.

        TOOLS: check_constraints, get_results

        1. Call check_constraints(constraints=[
             {"variable": "fuel_burned_kg", "operator": "<=",
              "value": 15000, "label": "fuel_limit"},
             {"variable": "gtow_kg", "operator": "<=",
              "value": 90000, "label": "mtom_limit"}
           ]).
           Add any constraints from the task specification.

        2. Compute the optimality gap vs F25 spec:
             gtow_gap_pct  = (gtow_kg  - 85700) / 85700 * 100
             fuel_gap_pct  = (fuel_burned_kg - 12100) / 12100 * 100
           Rating: |gap| <= 2% EXCELLENT, <= 5% GOOD,
                   <= 10% FAIR, > 10% POOR.

        3. Check cross-discipline conflicts:
           - Aero vs Structures: heavier wing offset by lower drag?
           - Propulsion vs Weight: is SCALE_FACTOR binding on climb?
           - Snowball: is MTOM trending up across retries?

        F25 spec context (informational):
          MTOM 85,700 kg, fuel 12,100 kg, range 2,500 nmi.
          v18 reference (wandb 7ngitswj): fuel 13,142 kg (+8.6%),
          gtow 76,840 kg (-10.3%), VERDICT: PASSED.

        Output EXACTLY:
          fuel_burned_kg: <value>
          gtow_kg: <value>
          wing_mass_kg: <value>
          oem_kg: <value from structures>
          converged: true/false
          optimality_gap_pct: <gtow_gap_pct>
          CONSTRAINTS_PASSED: <n>/<total>
          DISCIPLINARY_CONFLICTS: <tensions or "none">
          MOST_VIOLATED: <constraint + margin, or "all satisfied">
          UNCHECKED_CONSTRAINTS: C4 (fuel volume), C10 (flutter)
          RECOMMENDATION_TO: <stage name if CONTINUE>
          RECOMMENDED_CHANGE: <param → direction>
          VERDICT: PASSED / MINOR_ISSUES / MAJOR_ISSUES

        Include SESSION_ID in your output.
      description: "Constraint evaluation and MDO assessment"
      # Waits for the mission result AND for propulsion to have run
      # (propulsion's SFC/Fn feeds nothing downstream, so gate it here
      # so the verdict still reflects a completed propulsion discipline).
      depends_on: ["SIMULATION_RUN", "PROPULSION_SIZING"]
      transitions:
        - condition: "review_verdict == 'passed'"
          target: "COMPLETE"
        - condition: "review_verdict == 'minor_issues'"
          target: "GEOMETRY_SETUP"
        - condition: "review_verdict == 'major_issues'"
          target: "GEOMETRY_SETUP"

    ERROR_CLASSIFICATION:
      agent: null
      agent_prompt: null
      description: "Route based on error type — no agent, pure routing logic"
      transitions:
        - condition: "passes_remaining <= 0"
          target: "COMPLETE"
        - condition: "cycle_count >= escalation_threshold"
          target: "COMPLEXITY_ESCALATION"
        - condition: "always"
          target: "MISSION_CONFIG"

    COMPLEXITY_ESCALATION:
      agent: "mission_architect"
      agent_prompt: |
        Re-classify this task's complexity. The previous classification
        was {complexity}. The system has failed {cycle_count} times.
        Consider upgrading the complexity level.

        Output ONLY one word: simple, moderate, or complex.
      description: "Re-evaluate complexity after repeated failures"
      transitions:
        - condition: "complexity == 'simple'"
          target: "MISSION_CONFIG"
        - condition: "complexity == 'moderate'"
          target: "GEOMETRY_SETUP"
        - condition: "complexity == 'complex'"
          target: "GEOMETRY_SETUP"

    COMPLETE:
      agent: null
      agent_prompt: null
      description: "Terminal state"
      transitions: []

  resource_budgets:
    simple:
      max_passes: 8
      context_budget: 2500
      reasoning_enabled: false
      max_code_review_cycles: 1
      escalation_threshold: 2
    moderate:
      max_passes: 15
      context_budget: 3500
      reasoning_enabled: true
      max_code_review_cycles: 2
      escalation_threshold: 3
    complex:
      max_passes: 25
      context_budget: 5000
      reasoning_enabled: true
      max_code_review_cycles: 3
      escalation_threshold: 4
