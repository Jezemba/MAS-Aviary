# MDO F25 Staged Pipeline Configuration
# 6-stage pipeline with completion criteria per stage.

strategy: "sequential"

sequential:
  decomposition_mode: "human"
  pipeline_template: "mdo_f25"
  validate_interfaces: false
  stage_max_steps: 12

execution_handler: "staged_pipeline"

staged_pipeline:
  stages:
    - name: "geometry_engineer"
      completion_criteria:
        required_keywords: ["CPACS_FILE", "GEOMETRY_SET"]
        max_retries: 2
    - name: "aerodynamics_analyst"
      completion_criteria:
        required_keywords: ["DRAG_POLAR", "CL", "CD"]
        max_retries: 2
    - name: "structures_analyst"
      completion_criteria:
        required_keywords: ["OEM_KG", "MASS_ESTIMATION"]
        max_retries: 2
    - name: "propulsion_analyst"
      completion_criteria:
        required_keywords: ["SFC", "THRUST"]
        max_retries: 2
    - name: "simulation_executor"
      completion_criteria:
        required_keywords: ["CONVERGED", "FUEL_BURNED_KG"]
        max_retries: 2
    - name: "mdo_integrator"
      completion_criteria:
        required_keywords: ["VERDICT"]
        max_retries: 1

termination:
  keyword: "TASK_COMPLETE"
  max_turns: 50
  max_consecutive_errors: 3

context:
  max_recent_messages: 15
  max_context_tokens: 4000
