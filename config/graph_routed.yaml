# Graph-Routed Operational Methodology
# Controls routing through a state machine during execution

graph_routed:
  # --- Graph Mode ---
  # "predefined": graph loaded from config (default)
  # "llm_generated": LLM designs the graph at runtime
  graph_mode: "predefined"

  # --- Predefined Graph ---
  # Name of the graph to use when graph_mode is "predefined"
  # "aviary": Aviary aircraft design graph
  # "custom": user-defined graph below
  predefined_graph: "aviary"

  # Custom graph definition (used when predefined_graph is "custom")
  custom_graph: null

  # --- LLM Graph Settings ---
  # Whether the LLM can modify the graph during execution
  allow_graph_modification: false

  # --- Internal Representations ---
  # Whether to add mental model instructions to agent prompts.
  #
  # BACK TO false (2026-08-16). Briefly enabled to get the budget to the agent,
  # then reverted: _build_mental_model emits "The system has N passes remaining"
  # on EVERY turn, and a running count is a continuous pacing signal that only
  # graph_routed can produce -- three of eight combinations would get a
  # coordination input the others never see, contaminating the comparison.
  # It also differs from the condition the existing dataset was collected under.
  #
  # The budget still reaches the agent, but only as a THRESHOLD warning at 2/1/0
  # passes (_format_budget_warning), which is deliberately NOT gated on this flag
  # -- a run-ending warning must not depend on a display setting.
  internal_representations:
    enabled: false

  # --- Condition Evaluation ---
  # How error types are extracted from tool call stderr
  error_type_patterns:
    - pattern: "SyntaxError"
      type: "SyntaxError"
    - pattern: "NameError"
      type: "NameError"
    - pattern: "IndentationError"
      type: "IndentationError"
    - pattern: "AttributeError"
      type: "AttributeError"
    - pattern: "TypeError"
      type: "TypeError"
    - pattern: "ValueError"
      type: "ValueError"
    - pattern: "RuntimeError"
      type: "RuntimeError"

  # Fallback error type when no pattern matches
  default_error_type: "UnknownError"

  # --- Global Limits ---
  # Absolute maximum state transitions (safety valve)
  max_transitions: 25
