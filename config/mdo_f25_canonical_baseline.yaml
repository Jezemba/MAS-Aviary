# ============================================================================
# CANONICAL BASELINE — single source of truth for ALL discipline parameters.
#
# Experimental-design invariant: the ONLY thing that may differ between the 8
# combos is the COORDINATION STRUCTURE. Every discipline's tool/solver inputs
# come from THIS file (injected into the combo prompts via {{PLACEHOLDER}}
# substitution in the config loader). If it affects a physics result, it lives
# here, not in a per-combo prompt.
#
# DECISIONS still needed from the domain expert are marked  # >>> DECISION.
# Created 2026-07-27 on branch feat/paper-experiment-design.
# ============================================================================

# ---- GEOMETRY (tigl-mcp, port 8500) ----------------------------------------
geometry:
  wing_component_uid: "Wing1"          # was "Wing" in orch/net (caused NotFound retries)
  fuselage_component_uid: "Fuselage1"
  far_field_distance: 10.0             # was 10.0 vs 50 across combos
  # Mesh sizing: leave UNSET so generate_volume_mesh auto-scales relative to the
  # geometry characteristic length (~660k cells). Do NOT pass absolute mesh_size_*.
  mesh_size_min: null
  mesh_size_max: null

# ---- AERODYNAMICS (su2-mcp, port 8200) -------------------------------------
# Full SU2 numerics, verified end-to-end in run6 (real 155 s converged solve).
# REF_* are NOT hardcoded — they are DERIVED from the actual (fixed) geometry via
# get_wing_summary so coefficients are correct; the derivation rule is identical
# for all combos (do not hardcode the D150 baseline 61.39 as graph/staged did).
su2_config:
  SOLVER: "EULER"
  MATH_PROBLEM: "DIRECT"
  MACH_NUMBER: 0.785                   # aligned to ground-truth reference (was 0.78)
  AOA: 2.0
  REYNOLDS_NUMBER: 30000000            # ignored for inviscid EULER, kept nominal
  KIND_TURB_MODEL: "SA"                # ignored for inviscid EULER
  FREESTREAM_PRESSURE: 23842.0         # ISA @ 35000 ft (was 26500 @ ~33000 ft)
  FREESTREAM_TEMPERATURE: 218.8        # ISA @ 35000 ft (was 233)
  REF_DIMENSIONALIZATION: "DIMENSIONAL"
  CONV_NUM_METHOD_FLOW: "JST"
  JST_SENSOR_COEFF: "( 0.5, 0.02 )"
  NUM_METHOD_GRAD: "WEIGHTED_LEAST_SQUARES"
  TIME_DISCRE_FLOW: "EULER_IMPLICIT"
  CFL_NUMBER: 20
  CFL_ADAPT: "YES"
  CFL_ADAPT_PARAM: "( 0.5, 1.5, 5.0, 100.0 )"
  MGCYCLE: "W_CYCLE"
  MGLEVEL: 3
  LINEAR_SOLVER: "FGMRES"
  LINEAR_SOLVER_PREC: "ILU"
  LINEAR_SOLVER_ITER: 10
  LINEAR_SOLVER_ERROR: 1E-10
  ITER: 500
  CONV_FIELD: "RMS_DENSITY"
  CONV_RESIDUAL_MINVAL: -6
  CONV_STARTITER: 10
  HISTORY_OUTPUT: "( ITER, RMS_RES, AERO_COEFF )"
  SCREEN_OUTPUT: "( INNER_ITER, RMS_DENSITY, LIFT, DRAG )"
  OUTPUT_FILES: "( RESTART, PARAVIEW, SURFACE_CSV )"
  RESTART_SOL: "NO"
  MARKER_EULER: "( aircraft )"
  MARKER_FAR: "( farfield )"
  MARKER_PLOTTING: "( aircraft )"
  MARKER_MONITORING: "( aircraft )"
  # REF_AREA / REF_LENGTH / REF_ORIGIN_MOMENT_{X,Y,Z}: derive from get_wing_summary
  # of the current geometry (upstream DESIGN_STATE), identical rule for all combos.
  ref_from_upstream: true

# ---- MASS / STRUCTURES (mass-mcp, port 8700) -------------------------------
mass:
  wing_mass_method: "flops"            # DECISION 2026-07-27: FLOPS (OAS contributes little; start with FLOPS).
  design_load_factor: 2.5
  material: "aluminum"                 # NOTE: FLOPS ignores material — this is a nominal only, used if a
                                       # future run switches to "oas"/"both". Aluminum VERIFIED runs in OAS
                                       # (mWing 11,420 kg, no error, 2026-07-27).

# ---- PROPULSION (pycycle-mcp, port 8400) -----------------------------------
  # Canonical HBTF design point = pycycle repo reference (OpenMDAO/pycycle
  # example_cycles/high_bypass_turbofan.py). The pycycle-mcp bakes the HBTF model
  # in and defaults Fn_DES=5900 lbf; these values should NOT be overridden per-combo.
  design_mach: 0.785                   # aligned to reference (was 0.78)
  design_altitude_ft: 35000            # aligned to reference (was 33000)
  T4_MAX_degR: 2857                    # repo DESIGN.T4_MAX (was 1700/1600 in prompts — wrong/ignored)
  Fn_DES_lbf: 5900.0                   # repo DESIGN.Fn_DES (pycycle-mcp default; may be drag-coupled instead)
  fan_pressure_ratio: null             # UNSET per decision — pycycle-mcp uses the HBTF default (repo: fan.PR=1.685)
  BPR: 5.105                           # repo DESIGN.splitter.BPR (baked into the HBTF model)
  # OPR is a DERIVED output in pycycle (~30.5 from fan*lpc*hpc PR), NOT an input — do not pin OPR=40.

# ---- MISSION (aviary-mcp, port 8600) — already uniform, keep ---------------
  # Flight point aligned to the ground-truth reference (run_reference_benchmark.py):
  # M0.785 / 35000 ft / 1500 nmi. Same point used for aero (SU2) and propulsion above.
  cruise_mach: 0.785                   # was 0.78 — aligned to reference
  cruise_altitude_ft: 35000            # was 33000 — aligned to reference
  range_nmi: 1500                      # was 2500 — aligned to reference
  optimizer_max_iter: 200              # SLSQP iteration budget (already uniform)
