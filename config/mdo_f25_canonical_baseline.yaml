# ============================================================================
# CANONICAL BASELINE — single source of truth for ALL discipline parameters.
#
# Experimental-design invariant: the ONLY thing that may differ between the 8
# combos is the COORDINATION STRUCTURE. Every discipline's tool/solver inputs
# come from THIS file (injected into the combo prompts via {{PLACEHOLDER}}
# substitution in the config loader). If it affects a physics result, it lives
# here, not in a per-combo prompt.
#
# DECISIONS still needed from the domain expert are marked  # >>> DECISION.
# Created 2026-07-27 on branch feat/paper-experiment-design.
# ============================================================================

# ---- GEOMETRY (tigl-mcp, port 8500) ----------------------------------------
geometry:
  wing_component_uid: "Wing1"          # was "Wing" in orch/net (caused NotFound retries)
  fuselage_component_uid: "Fuselage1"
  far_field_distance: 10.0             # B116 mesh study (2026-09-30): see mesh_size_min below
  mesh_size_min: 0.33                  # the knee. L0 (default 0.663, 736k cells, 5 min) gives CD -0.0124;
                                       # this (2.32M cells, 15 min) gives CD +0.00070; 4x finer (11.3M, 95 min)
                                       # gives +0.00116 for 6x the cost. Absolute CD is still ~40% under the
                                       # 11.3M value, so quote drag as comparative, not absolute. Replaces the
                                       # TEMP deadline settings of 2026-07-30 (B6/B45), which the mesh guard now
                                       # refuses outright (~6.9M estimated cells against a 3M cap).
  mesh_size_max: 12.0

# ---- AERODYNAMICS (su2-mcp, port 8200) -------------------------------------
# Full SU2 numerics, verified end-to-end in run6 (real 155 s converged solve).
# REF_* are NOT hardcoded — they are DERIVED from the actual (fixed) geometry via
# get_wing_summary so coefficients are correct; the derivation rule is identical
# for all combos (do not hardcode the D150 baseline 61.39 as graph/staged did).
su2_config:
  SOLVER: "EULER"
  MATH_PROBLEM: "DIRECT"
  MACH_NUMBER: 0.78                    # DLR-F25 cruise Mach
  AOA: 2.0
  REYNOLDS_NUMBER: 30000000            # ignored for inviscid EULER, kept nominal
  KIND_TURB_MODEL: "SA"                # ignored for inviscid EULER
  # B306 (audit F18): FREESTREAM_PRESSURE / FREESTREAM_TEMPERATURE removed. They read 26436.0 Pa / 222.8 K, labelled
  # "ISA @ 33000 ft", but ISA there is 26,200.8 Pa / 222.77 K. The framework always passes cruise_altitude_ft and
  # su2-mcp sets the ISA freestream from it (drag_model.isa); su2-mcp fix/final-rerun refuses other values.
  REF_DIMENSIONALIZATION: "DIMENSIONAL"
  CONV_NUM_METHOD_FLOW: "JST"
  JST_SENSOR_COEFF: "( 0.5, 0.02 )"
  NUM_METHOD_GRAD: "WEIGHTED_LEAST_SQUARES"
  TIME_DISCRE_FLOW: "EULER_IMPLICIT"
  CFL_NUMBER: 20
  CFL_ADAPT: "YES"
  CFL_ADAPT_PARAM: "( 0.5, 1.5, 5.0, 100.0 )"
  MGCYCLE: "W_CYCLE"
  MGLEVEL: 3
  LINEAR_SOLVER: "FGMRES"
  LINEAR_SOLVER_PREC: "ILU"
  LINEAR_SOLVER_ITER: 10
  LINEAR_SOLVER_ERROR: 1.0e-10         # float (not "1E-10" string, which YAML mis-types)
  ITER: 500                            # back to 500 for the study: FIXED_CL_MODE updates AOA only after the
                                       # flow converges (~65 iters), then re-converges, so 120 left the trim no room (B111)
  CONV_FIELD: "RMS_DENSITY"
  CONV_RESIDUAL_MINVAL: -6
  CONV_STARTITER: 10
  HISTORY_OUTPUT: "( ITER, RMS_RES, AERO_COEFF )"
  SCREEN_OUTPUT: "( INNER_ITER, RMS_DENSITY, LIFT, DRAG )"
  # SURFACE_PARAVIEW writes surface_flow.vtu -- the aircraft's skin with Cp, openable in ParaView.
  # Its absence is why a one-winged mesh (B115) was solved in every study without anyone seeing it.
  OUTPUT_FILES: "( RESTART, PARAVIEW, SURFACE_PARAVIEW, SURFACE_CSV )"
  RESTART_SOL: "NO"
  MARKER_EULER: "( aircraft )"
  MARKER_FAR: "( farfield )"
  MARKER_PLOTTING: "( aircraft )"
  MARKER_MONITORING: "( aircraft )"
  # REF_AREA / REF_LENGTH / REF_ORIGIN_MOMENT_{X,Y,Z}: derive from get_wing_summary
  # of the current geometry (upstream DESIGN_STATE), identical rule for all combos.
  ref_from_upstream: true

# ---- MASS / STRUCTURES (mass-mcp, port 8700) -------------------------------
mass:
  wing_mass_method: "flops"            # DECISION 2026-07-27: FLOPS (OAS contributes little; start with FLOPS).
  design_load_factor: 2.5
  material: "aluminum"                 # NOTE: FLOPS ignores material — this is a nominal only, used if a
                                       # future run switches to "oas"/"both". Aluminum VERIFIED runs in OAS
                                       # (mWing 11,420 kg, no error, 2026-07-27).

# ---- PROPULSION (pycycle-mcp, port 8400) -----------------------------------
propulsion:
  # Canonical HBTF design point = pycycle repo reference (OpenMDAO/pycycle
  # example_cycles/high_bypass_turbofan.py). The pycycle-mcp bakes the HBTF model
  # in and defaults Fn_DES=5900 lbf; these values should NOT be overridden per-combo.
  design_mach: 0.78                    # DLR-F25 cruise Mach
  design_altitude_ft: 33000            # DLR-F25 cruise altitude
  T4_MAX_degR: 2857                    # repo DESIGN.T4_MAX (was 1700/1600 in prompts — wrong/ignored)
  Fn_DES_lbf: 5900.0                   # repo DESIGN.Fn_DES (pycycle-mcp default; may be drag-coupled instead)
  fan_pressure_ratio: null             # UNSET per decision — pycycle-mcp uses the HBTF default (repo: fan.PR=1.685)
  BPR: 5.105                           # repo DESIGN.splitter.BPR (baked into the HBTF model)
  # OPR is a DERIVED output in pycycle (~30.5 from fan*lpc*hpc PR), NOT an input — do not pin OPR=40.
  # B306 (audit F12): the design table's "Set (fixed)" rows, pinned on every set_inputs by the framework
  # (data_plane._pin_cycle_fixed_inputs). tests/test_b306_* check these equal the prompt tables.
  fixed_inputs:
    fan.eff: 0.8948
    lpc.eff: 0.9243
    hpc.eff: 0.8707
    hpt.eff: 0.8888
    lpt.eff: 0.8996

# ---- MISSION (aviary-mcp, port 8600) — already uniform, keep ---------------
mission:
  # DLR-F25 mission (2500 nmi, 239 pax, M0.78, FL330). Same point used for aero (SU2)
  # and propulsion above. The session config + run_reference_benchmark.py were fixed to
  # match this (they carried a leftover A320-class 1500 nmi / M0.785 / 162 pax spec).
  cruise_mach: 0.78                    # DLR-F25
  cruise_altitude_ft: 33000            # DLR-F25 (FL330)
  range_nmi: 2500                      # DLR-F25
  num_passengers: 239                  # DLR-F25
  optimizer_max_iter: 200              # SLSQP iteration budget (already uniform)

# ---- BASELINE (B306, A8 decision of Jessica 2026-11-18) --------------------
# The SU2 lift target is computed for mass-mcp's SIZED gross mass carried from the previous iteration; on the
# first iteration for the baseline's sized mass, given here. It must be mass-mcp's converged sizing of the D150
# baseline (D150_simple.xml) at the study's mission, with the mass-mcp version the study runs (A15 / B280 fixes).
# Until it is set, every first-iteration SU2 configuration is REFUSED (NO_TRIM_TARGET) -- deliberately: there is no
# fallback mass (audit F4). The graph-routed baseline cache key includes this value.
baseline:
  # Values 2026-11-18 (ws8 /data/Jessica/final_fix/baseline/results/iterate_run3/, driver code/a16/baseline_driver.py):
  # the unchanged D150 (mass-mcp tests/fixtures/D150_simple.xml, opened, measured, exported) through the framework
  # at 9a4e0ac with mass-mcp dca2b1e, aviary-mcp 9d10094, pycycle-mcp 001456b, tigl-mcp 6d1a8c8 (A16-checked slot).
  # Mass <-> engine fixed point, iterated explicitly (H5): estimate_mass with deck + scale -> sized mass M (converged,
  # sizing_report.driver residuals 0) -> aviary get_cruise_point at M (M0.78, 33,000 ft; FLOPS L/D 17.0530, CL 0.6509,
  # CD 0.03817) -> Fn_DES = M g / (L/D) / 2 / 4.448 * 1.25 = 7,371.65 lbf -> pyCycle run_cycle Fn 7,371.65 lbf ->
  # scale = Fn / 5,900 lbf (the deck's reference_fn_des_lbf). Start 88,066 kg / 1.3314; sized masses 92,092.7,
  # 91,355.9, 91,224.6, 91,201.8, 91,197.8, 91,197.1 kg: converged (change < 1 kg) after 6 iterations.
  sized_mtom_kg: 91197.1
  # The baseline's engine (H5, coordinator 2026-11-18): the deck and SCALE_FACTOR the first iteration's mass estimate
  # and aviary cruise point use (later iterations carry the previous iteration's flown engine). Unset = refused.
  # Deck = pyCycle generate_engine_deck of the canonical cycle (prompt table: BPR 5.105, T4_MAX 2857, T4_TAKEOFF 3540,
  # T4_CLIMB 3090, fan/LPC/HPC PR 1.685/1.935/9.369, fixed efficiencies above, M0.78 / 33,000 ft), key
  # 7815057d6edc9732 (size-normalised at 5,900 lbf; SLS 29,088.2 lbf; design TSFC 0.64324), the study deck (md5
  # b1c1e040e4abe82782e47d1ed7666ca8). MACHINE-SPECIFIC PATH: the file must exist at this path on the run machine
  # (data_plane refuses ENGINE_DECK_NOT_READABLE otherwise); on ws8 it is the study_decks copy.
  engine_deck_file: /home/aipexws8/Jessica/Avion/study_decks/deck_7815057d6edc9732.deck
  engine_scale_factor: 1.2494328339916752
