# MDO F25 Networked Agents — peer coordination across 5 MCPs.
# MCPs: TiGL (geometry), SU2 (aero CFD), CPACS-Mass (structures), pyCycle (propulsion), Aviary (mission/sim)

peer_template:
  # verbatim (Jessica, 2026-10-10): every peer's system message is this combination's section of
  # networked.md (repo root), sent exactly as written -- no library template, no claiming additions.
  # Each cycle's message is data only: the peer's own recent work, the DESIGN_STATE with the open
  # sessions, the TODO board, design.json (src/coordination/prompt_assembly.py peer_message).
  prompt_assembly: verbatim
  prompt_source: networked.md

# NOTE: a workflow_phases block previously lived here, but it was
# dormant — the networked strategy reads workflow_phases from the
# COORDINATION YAML (config/aviary_mdo_f25_networked.yaml), not from
# this agents file. For the MDO F25 networked combo we deliberately
# leave workflow_phases empty in the coord YAML so peers can see all
# 54 MCP tools and self-organize via the blackboard, matching the
# networked strategy's design intent ("no structure, no orchestrator,
# all peers see all tools"). Phase gating would defeat that purpose;
# if you want enforcement, use sequential or orchestrated instead.
