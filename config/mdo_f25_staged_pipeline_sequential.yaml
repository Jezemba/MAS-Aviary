# MDO F25 Staged Pipeline — 7-stage 5-MCP MDO assembly line.
#
# This file is loaded by StagedPipelineHandler via the
# `pipeline_path` entry in handler_config (see batch_runner.py).
# Stage names match the 7-agent template in
# `config/mdo_f25_sequential_agents.yaml`; the agent's full role
# definition (with discipline knowledge, MCP tool guidance, and F25
# parameter context) lives there. The `stage_prompt` below is just
# a short reminder of stage objective + completion keyword, since
# the staged_pipeline handler APPENDS stage_prompt to the agent's
# existing system prompt — there's no need to repeat the role here.
#
# Completion criteria are OBSERVATIONAL ONLY — they never block
# advancement, they only record whether each stage hit its target.
# Per-stage criteria use:
#   - `tool_attempted` (most reliable signal for stages whose
#     completion is determined by which MCP tool fires)
#   - `output_contains` with `verdict_present` for stages whose
#     completion is signalled by a keyword in the output (the
#     handler's `verdict_patterns` in handler_config below picks
#     up MDO-specific keywords as well as the defaults).

mdo_f25_pipeline:
  stages:
    # ── Stage 1: Geometry ─────────────────────────────────────────
    - name: "geometry_engineer"
      completion_criteria:
        type: "tool_attempted"
        check: "tool_called"
        tool_name: "open_cpacs"
        description: "geometry_engineer opened a CPACS session via tigl-mcp"
      stage_prompt: ""   # sequential-prompts-v2: the role in mdo_f25_sequential_agents.yaml carries the whole stage prompt

    # ── Stage 2: Aerodynamics (SU2 CFD) ───────────────────────────
    - name: "aerodynamics_analyst"
      completion_criteria:
        type: "tool_attempted"
        check: "tool_called"
        tool_name: "run_simulation"
        description: "aerodynamics_analyst ran a CFD simulation via su2-mcp"
      stage_prompt: ""   # sequential-prompts-v2: the role in mdo_f25_sequential_agents.yaml carries the whole stage prompt

    # ── Stage 3: Structures (mass-mcp / FLOPS) ────────────────────
    - name: "structures_analyst"
      completion_criteria:
        type: "tool_attempted"
        check: "tool_called"
        tool_name: "estimate_mass"
        description: "structures_analyst estimated component masses via mass-mcp"
      stage_prompt: ""   # sequential-prompts-v2: the role in mdo_f25_sequential_agents.yaml carries the whole stage prompt

    # ── Stage 4: Propulsion (pyCycle) ─────────────────────────────
    - name: "propulsion_analyst"
      completion_criteria:
        type: "tool_attempted"
        check: "tool_called"
        tool_name: "run_cycle"
        description: "propulsion_analyst ran a pyCycle design-point cycle"
      stage_prompt: ""   # sequential-prompts-v2: the role in mdo_f25_sequential_agents.yaml carries the whole stage prompt

    # ── Stage 5: Mission Architect (Aviary) ───────────────────────
    - name: "mission_architect"
      completion_criteria:
        type: "tool_attempted"
        check: "tool_called"
        tool_name: "set_aircraft_parameters"
        description: "mission_architect set aircraft parameters via aviary-mcp"
      stage_prompt: ""   # sequential-prompts-v2: the role in mdo_f25_sequential_agents.yaml carries the whole stage prompt

    # ── Stage 6: Simulation Executor (Aviary) ─────────────────────
    - name: "simulation_executor"
      completion_criteria:
        type: "tool_attempted"
        check: "tool_called"
        tool_name: "run_simulation"
        description: "simulation_executor ran the Aviary mission"
      stage_prompt: ""   # sequential-prompts-v2: the role in mdo_f25_sequential_agents.yaml carries the whole stage prompt

    # ── Stage 7: MDO Integrator ───────────────────────────────────
    - name: "mdo_integrator"
      completion_criteria:
        type: "output_contains"
        check: "verdict_present"
        description: "mdo_integrator produced a VERDICT keyword"
      stage_prompt: ""   # sequential-prompts-v2: the role in mdo_f25_sequential_agents.yaml carries the whole stage prompt